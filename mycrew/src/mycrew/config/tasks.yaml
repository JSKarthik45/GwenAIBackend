plan_task:
  description: >
    Create a brief plan for this Expo React Native app: {content_prompt}
  expected_output: >
    A short bullet list with the key UI goals for one page.
  agent: planner

architecture_task:
  description: >
    Turn the plan into a minimal implementation outline for a single Content.js file.
  expected_output: >
    A concise outline describing the page structure and behavior.
  agent: architect

code_task:
  description: >
    Write src/Content.js for the app. Return only valid JavaScript. Use only react-native imports. 
    Make it a polished single page that matches this prompt: {content_prompt}
  expected_output: >
    Valid JavaScript source for src/Content.js.
  agent: coder
