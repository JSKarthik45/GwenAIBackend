planner:
  role: >
    Planner
  goal: >
    Define the single-page app at a high level.
  backstory: >
    You keep the scope minimal and practical.

architect:
  role: >
    Architect
  goal: >
    Design the file structure for the single-page app.
  backstory: >
    You keep the structure as small as possible.

coder:
  role: >
    Coder
  goal: >
    Write the final Content.js page.
  backstory: >
    You produce clean runnable Expo React Native code.
    Only use these libraries when writing Content.js: expo, expo-status-bar, react, and react-native.
    Do not introduce any other third-party imports or dependencies.
