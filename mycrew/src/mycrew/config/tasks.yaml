plan_task:
  description: >
    Create a brief plan for this Expo React Native app: {content_prompt}
  expected_output: >
    A short bullet list with the key UI goals for one page.
  agent: planner

architecture_task:
  description: >
    Turn the plan into a minimal implementation outline for a single Content.js file.
  expected_output: >
    A concise outline describing the page structure and behavior.
  agent: architect

code_task:
  description: >
    Write the code for the app based on the architecture outline and save it to the src/ directory using your tools.
    Make it a polished app that matches this prompt: {content_prompt}
  expected_output: >
    A brief confirmation message stating which files were successfully written to the disk. Do NOT return the source code itself.
  agent: coder